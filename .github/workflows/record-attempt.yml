name: Record dashboard attempt

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: chennai-attempt-log
  cancel-in-progress: false

jobs:
  record:
    if: startsWith(github.event.issue.title, '[Attempt]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out the dataset branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate and append the attempt
        run: node scripts/record-attempt.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit the updated dataset
        run: |
          git config user.name "Chennai Slot Lab"
          git config user.email "actions@users.noreply.github.com"
          git add -- public/data/attempts.json
          if ! git diff --cached --quiet; then
            git commit -m "Record attempt #${{ github.event.issue.number }}"
            git push
          fi

      - name: Close the intake issue
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Recorded in the dashboard dataset. Refresh the dashboard shortly to load it from GitHub."
          gh issue close "${{ github.event.issue.number }}"
        env:
          GH_TOKEN: ${{ github.token }}
